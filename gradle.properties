# Gradle 配置
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# 工具链：NeoForge 21.1 需要 Java 21（class major 65）
# ⚠️ 本机的 JDK 路径**不要写在这里**。写成项目级属性后，Linux CI 会把
#    `C:\Program Files\...` 当 URI 解析，直接抛
#    URISyntaxException: Illegal character in opaque part at index 2
#    本机路径放 ~/.gradle/gradle.properties（用户级），详见 docs/BUILDING.md。
#    CI 上用 actions/setup-java 装的 JDK 21，Gradle 自动探测即可。

# 模组元信息
mod_id=siao
mod_name=Super Insane Apple Recipe Overload
mod_version=0.1.0
mod_group=com.siao.appleoverload
mod_authors=Apple Cult
mod_license=MIT

# 复用 PCL 启动器已有的原版素材，避免 runClient 下载几百 MB
launcher_assets_dir=D:/MC/PCL CE/.minecraft/assets
launcher_asset_index=17
