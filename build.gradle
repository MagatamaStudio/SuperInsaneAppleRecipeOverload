plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group
// 产物文件名用模组名（仓库名），不是 modid —— modid 是技术命名空间，必须保持小写 siao
base.archivesName = mod_name

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.230'

    runs {
        client {
            client()
        }
        server {
            server()
            // 自检：设环境变量 SIAO_SELFTEST=true 后 runServer，跑完自动关服
            systemProperty 'siao.selftest', (System.getenv('SIAO_SELFTEST') ?: 'false')
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        siao {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // 本地离线仓库：AE2 api jar 也放这里，保证 --offline 构建不被打断
    maven { name = 'LocalOffline'; url = uri('gradle/offline-repo') }
    mavenCentral()
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    // AE2（软依赖）
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
}

dependencies {
    // AE2 只用到 appeng.api.*，api jar 足够；compileOnly 保证服务器/客户端没装 AE2 也能跑
    compileOnly "org.appliedenergistics:appliedenergistics2:19.2.18:api"
    // JEI 只在开发期编译插件用；玩家侧是可选的，没装 JEI 时插件类不会被加载
    compileOnly files("gradle/offline-repo/jei/jei-1.21.1-neoforge-19.8.4.113.jar")
}

tasks.withType(ProcessResources).configureEach {
    // 源文件是 UTF-8（含中文描述），expand 默认用平台编码读会读坏
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version: '1.21.1',
            neo_version      : '21.1.230',
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_license      : mod_license
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// 生产 jar 排掉自检类：它只在 -Dsiao.selftest=true 时用，几十 KB 和一堆断言字符串
// 不该发给玩家。开发环境的 runServer 直接从源码跑，CI 的自检不受影响。
tasks.named('jar') {
    exclude 'com/siao/appleoverload/content/SiaoSelfTest*.class'
}