modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/MagatamaStudio/SuperInsaneAppleRecipeOverload/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Everything can be compressed. Even the apple. Especially the apple.

九个苹果压成一个，一直压到九重（387,420,489 个苹果），最后拿去合一根普通的木棍。
压缩链只能由机器完成，工作台做不出来。

Five machines, 10,548 blocks, AE2 integration, JEI/EMI support.
中文 / English / 日本語
'''
logoFile = "logo.png"
displayURL = "https://github.com/MagatamaStudio/SuperInsaneAppleRecipeOverload"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ae2"
type = "optional"
versionRange = "[19.2.0,)"
ordering = "AFTER"
side = "BOTH"
