name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) 编译 + 打包：能出 jar 就算过
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # Windows 上提交的文件没有可执行位，Linux runner 直接 ./gradlew 会 Permission denied
      - name: 给 gradlew 加可执行位
        run: chmod +x gradlew

      - name: 构建
        run: ./gradlew build --stacktrace

      - name: 上传 jar
        uses: actions/upload-artifact@v4
        with:
          name: siao-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports/**
          if-no-files-found: ignore

  # 2) 真跑服务端自检：配方解析、附魔穿透、三台机器全都过一遍
  #    这是唯一能证明「配方真的能匹配、机器真的产出」的环节
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 给 gradlew 加可执行位
        run: chmod +x gradlew

      - name: 接受 EULA
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

      # SIAO_SELFTEST 由 build.gradle 读环境变量传给 JVM，自检跑完自动关服
      - name: 跑服务端自检
        run: SIAO_SELFTEST=true ./gradlew runServer --stacktrace

      - name: 检查自检结论
        run: |
          echo "---- SIAO-TEST 全部结果 ----"
          grep "SIAO-TEST" run/logs/latest.log || true
          echo "---- 配方解析错误（应为空）----"
          grep "Parsing error loading recipe" run/logs/latest.log || true
          grep -q "RESULT pass=[0-9]* fail=0" run/logs/latest.log
          if grep -q "Parsing error loading recipe" run/logs/latest.log; then
            echo "存在配方解析错误" >&2
            exit 1
          fi

      - name: 上传服务端日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-logs
          path: run/logs/
          if-no-files-found: warn
